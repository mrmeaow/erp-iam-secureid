<div class="fixed top-4 right-4 z-[9999] flex flex-col gap-3 pointer-events-none">
  @for (toast of toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-center p-4 rounded-xl border border-white/10 shadow-2xl backdrop-blur-md transition-all duration-300 transform translate-x-0 opacity-100 min-w-[300px]"
      [ngClass]="{
        'bg-emerald-500/20 text-emerald-400': toast.type === 'success',
        'bg-red-500/20 text-red-400': toast.type === 'error',
        'bg-amber-500/20 text-amber-400': toast.type === 'warning',
        'bg-blue-500/20 text-blue-400': toast.type === 'info',
      }"
    >
      <div class="flex-shrink-0 mr-3">
        @if (toast.type === 'success') {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 13l4 4L19 7"
            ></path>
          </svg>
        } @else if (toast.type === 'error') {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        } @else {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            ></path>
          </svg>
        }
      </div>
      <div class="text-sm font-medium">{{ toast.message }}</div>
      <button
        (click)="remove(toast.id)"
        class="ml-auto -mr-1 p-1.5 hover:bg-white/10 rounded-lg transition-colors"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>
  }
</div>
