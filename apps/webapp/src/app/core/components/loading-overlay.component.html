@if (isLoading()) {
  <div
    class="fixed inset-0 z-[10000] flex items-center justify-center bg-[#0d1117]/60 backdrop-blur-md"
  >
    <div class="flex flex-col items-center">
      <div
        class="w-12 h-12 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin shadow-[0_0_20px_rgba(59,130,246,0.3)]"
      ></div>
      <p class="mt-4 text-sm font-medium text-blue-400 animate-pulse tracking-wider uppercase">
        Loading...
      </p>
    </div>
  </div>
}
