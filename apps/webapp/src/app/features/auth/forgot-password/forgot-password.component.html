<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-100">Identity Recovery</h2>
    <p class="mt-2 text-sm text-slate-400">
      Enter your email address to receive a security reset token.
    </p>
  </div>

  <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label for="email" class="block text-sm font-medium text-slate-300">Identity Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        class="mt-1 block w-full rounded-lg bg-slate-800 border-slate-700 text-slate-100 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm px-4 py-2.5 outline-none transition-all"
        placeholder="name@company.com"
        [class.border-red-500]="isFieldInvalid('email')"
      />
      @if (isFieldInvalid('email')) {
        <p class="mt-1 text-xs text-red-400">Please provide a valid enterprise email.</p>
      }
    </div>

    <div>
      <button
        type="submit"
        [disabled]="forgotPasswordForm.invalid"
        class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Request Reset Token
      </button>
    </div>
  </form>

  <div class="text-center">
    <a routerLink="/auth/login" class="text-sm font-medium text-indigo-400 hover:text-indigo-300">
      Back to Secure Access
    </a>
  </div>
</div>
