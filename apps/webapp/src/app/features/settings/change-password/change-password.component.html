<div class="max-w-2xl mx-auto py-10">
  <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-8 backdrop-blur-sm">
    <div class="mb-8">
      <h2 class="text-3xl font-bold text-slate-100">Credential Management</h2>
      <p class="mt-2 text-slate-400">
        Update your enterprise security credentials to maintain system integrity.
      </p>
    </div>

    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="oldPassword" class="block text-sm font-semibold text-slate-300 mb-2"
          >Current Security Credential</label
        >
        <input
          id="oldPassword"
          type="password"
          formControlName="oldPassword"
          class="w-full bg-slate-800 border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
          placeholder="••••••••"
          [class.border-red-500]="isFieldInvalid('oldPassword')"
        />
        @if (isFieldInvalid('oldPassword')) {
          <p class="mt-1 text-xs text-red-400">Current credential is required.</p>
        }
      </div>

      <div>
        <label for="newPassword" class="block text-sm font-semibold text-slate-300 mb-2"
          >New Security Credential</label
        >
        <input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          class="w-full bg-slate-800 border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
          placeholder="••••••••"
          [class.border-red-500]="isFieldInvalid('newPassword')"
        />
        @if (isFieldInvalid('newPassword')) {
          <p class="mt-1 text-xs text-red-400">New credential must be at least 8 characters.</p>
        }
      </div>

      <div class="pt-4">
        <button
          type="submit"
          [disabled]="changePasswordForm.invalid"
          class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-bold rounded-xl transition-all shadow-lg shadow-indigo-500/20 active:scale-95 flex items-center justify-center gap-2"
        >
          <span>Update Credentials</span>
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"
            />
          </svg>
        </button>
      </div>
    </form>
  </div>
</div>
